<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>符号・文字式 克服ドリル</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap');

  :root {
    --bg: #ddeef7;
    --surface: #ffffff;
    --surface2: #eaf4fb;
    --accent: #e84855;
    --accent2: #2980b9;
    --gold: #e67e22;
    --green: #27ae60;
    --text: #1a2a3a;
    --muted: #7a9ab0;
    --border: rgba(0,80,140,0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -30%;
    left: -20%;
    width: 60%;
    height: 60%;
    background: radial-gradient(circle, rgba(41,128,185,0.10) 0%, transparent 70%);
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    bottom: -20%;
    right: -10%;
    width: 50%;
    height: 50%;
    background: radial-gradient(circle, rgba(232,72,85,0.07) 0%, transparent 70%);
    pointer-events: none;
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .header h1 {
    font-family: 'Kaisei Decol', serif;
    font-size: 22px;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }

  .header p {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .progress-bar-wrap {
    width: 100%;
    max-width: 500px;
    background: var(--surface2);
    border-radius: 99px;
    height: 6px;
    margin-bottom: 8px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .progress-text {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 20px;
  }

  /* Category pill */
  .cat-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 14px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    margin-bottom: 16px;
    border: 1px solid;
  }
  .cat-0 { color: #e84855; border-color: rgba(232,72,85,0.4); background: rgba(232,72,85,0.08); }
  .cat-1 { color: #e67e22; border-color: rgba(230,126,34,0.4); background: rgba(230,126,34,0.08); }
  .cat-2 { color: #2980b9; border-color: rgba(41,128,185,0.4); background: rgba(41,128,185,0.08); }
  .cat-3 { color: #8e44ad; border-color: rgba(142,68,173,0.4); background: rgba(142,68,173,0.08); }
  .cat-4 { color: #16a085; border-color: rgba(22,160,133,0.4); background: rgba(22,160,133,0.08); }
  .cat-5 { color: #27ae60; border-color: rgba(39,174,96,0.4); background: rgba(39,174,96,0.08); }
  .cat-6 { color: #d35400; border-color: rgba(211,84,0,0.4); background: rgba(211,84,0,0.08); }

  /* Card */
  .card {
    width: 100%;
    max-width: 500px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 32px;
    position: relative;
    text-align: center;
    min-height: 240px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    user-select: none;
    animation: cardIn 0.35s cubic-bezier(.34,1.3,.64,1) both;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(18px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,80,140,0.12); }
  .card:active { transform: scale(0.98); }

  .card-hint {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 20px;
    letter-spacing: 0.04em;
  }

  .problem-text {
    font-family: 'Kaisei Decol', serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.03em;
    margin-bottom: 10px;
    line-height: 1.3;
  }

  .problem-sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .tap-prompt {
    font-size: 12px;
    color: rgba(0,60,120,0.25);
    letter-spacing: 0.1em;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* Answer reveal */
  .answer-reveal {
    width: 100%;
    max-width: 500px;
    animation: answerIn 0.3s cubic-bezier(.34,1.2,.64,1) both;
    margin-top: 14px;
  }

  @keyframes answerIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .answer-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 24px;
    margin-bottom: 12px;
  }

  .answer-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }

  .answer-value {
    font-family: 'Kaisei Decol', serif;
    font-size: 36px;
    font-weight: 700;
    color: var(--green);
  }

  .hint-box {
    background: rgba(61,155,233,0.06);
    border: 1px solid rgba(61,155,233,0.2);
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 12px;
    color: rgba(61,155,233,0.9);
    line-height: 1.7;
    margin-bottom: 14px;
    text-align: left;
  }

  .hint-box strong { color: var(--accent2); }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 500px;
  }

  .btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
    letter-spacing: 0.03em;
  }

  .btn:active { transform: scale(0.97); }

  .btn-ok {
    background: var(--green);
    color: #fff;
  }
  .btn-ok:hover { background: #27ae60; }

  .btn-ng {
    background: var(--accent);
    color: #fff;
  }
  .btn-ng:hover { background: #c0392b; }

  .btn-next {
    background: linear-gradient(135deg, var(--accent2), #2980b9);
    color: #fff;
  }
  .btn-next:hover { opacity: 0.9; }

  /* Result screen */
  .result-screen {
    width: 100%;
    max-width: 500px;
    text-align: center;
    animation: cardIn 0.4s ease both;
  }

  .result-emoji { font-size: 56px; margin-bottom: 16px; display: block; }

  .result-title {
    font-family: 'Kaisei Decol', serif;
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .result-score {
    font-size: 48px;
    font-weight: 700;
    margin: 16px 0;
  }

  .score-good { color: var(--green); }
  .score-ok { color: var(--gold); }
  .score-bad { color: var(--accent); }

  .result-detail {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 24px;
    line-height: 1.8;
  }

  .missed-list {
    background: var(--surface2);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;
    text-align: left;
    max-height: 200px;
    overflow-y: auto;
  }

  .missed-list h3 {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }

  .missed-item {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text);
  }

  .missed-item:last-child { border-bottom: none; }
  .missed-ans { color: var(--accent); font-weight: 700; }

  .btn-retry {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), #c0392b);
    color: #fff;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.15s ease;
  }

  .btn-retry:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(232,72,85,0.3); }

  /* Streak */
  .streak-badge {
    position: fixed;
    top: 16px;
    right: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 12px;
    color: var(--gold);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 5px;
    box-shadow: 0 2px 10px rgba(0,80,140,0.10);
  }

  /* step dots */
  .dots {
    display: flex;
    gap: 4px;
    justify-content: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
    max-width: 500px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border);
    transition: background 0.3s, transform 0.3s;
    flex-shrink: 0;
  }
  .dot.done { background: var(--green); border-color: var(--green); }
  .dot.current { background: var(--accent); border-color: var(--accent); transform: scale(1.5); }
  .dot.wrong { background: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>

<div class="header">
  <h1>符号・文字式 克服ドリル</h1>
  <p>SIGN & ALGEBRA MASTERY TRAINING</p>
</div>

<div id="streak-badge" class="streak-badge">🔥 <span id="streak-num">0</span> 連続正解</div>

<div id="app"></div>

<script>
const CATEGORIES = [
  { name: '乗算の符号', icon: '×', cls: 'cat-0' },
  { name: '−(−x)変換', icon: '−', cls: 'cat-1' },
  { name: '累乗の係数', icon: '²', cls: 'cat-2' },
  { name: '方程式の符号', icon: '=', cls: 'cat-3' },
  { name: '文字式の表し方', icon: 'a', cls: 'cat-4' },
  { name: '一次式の計算', icon: '+', cls: 'cat-5' },
  { name: '式の展開・整理', icon: '()', cls: 'cat-6' },
];

const PROBLEMS = [
  // 乗算の符号
  { cat: 0, q: '−5 + 6×(−3)', a: '−23', hint: '6×(−3) <strong>= −18</strong>（負×正=負）<br>−5 + (−18) = −23' },
  { cat: 0, q: '8 − 4×(−2)', a: '16', hint: '4×(−2) <strong>= −8</strong><br>8 − (−8) = 8 + 8 = 16' },
  { cat: 0, q: '6 + (−2)×7', a: '−8', hint: '(−2)×7 <strong>= −14</strong>（負×正=負）<br>6 + (−14) = −8' },
  { cat: 0, q: '10 − 2×(−6)', a: '22', hint: '2×(−6) <strong>= −12</strong><br>10 − (−12) = 10 + 12 = 22' },
  { cat: 0, q: '7 + (−4)×(−2)', a: '15', hint: '(−4)×(−2) <strong>= +8</strong>（負×負=正！）<br>7 + 8 = 15' },
  { cat: 0, q: '13 + 2×(−9)', a: '−5', hint: '2×(−9) <strong>= −18</strong><br>13 + (−18) = −5' },
  { cat: 0, q: '−9 + (−3)×4', a: '−21', hint: '(−3)×4 <strong>= −12</strong>（負×正=負）<br>−9 + (−12) = −21' },

  // −(−x)変換
  { cat: 1, q: '3 − (−5) − 6', a: '2', hint: '−(−5) <strong>= +5</strong><br>3 + 5 − 6 = 2' },
  { cat: 1, q: '9 + (−3) − (−6)', a: '12', hint: '−(−6) <strong>= +6</strong><br>9 − 3 + 6 = 12' },
  { cat: 1, q: '1/2 + (−1/4)', a: '1/4', hint: '符号は<strong>−1/4のまま</strong>（+に変わらない）<br>2/4 − 1/4 = 1/4' },
  { cat: 1, q: '−4 + 3 − (−10)', a: '9', hint: '−(−10) <strong>= +10</strong><br>−4 + 3 + 10 = 9' },
  { cat: 1, q: '−12 + 7 − (−3)', a: '−2', hint: '−(−3) <strong>= +3</strong><br>−12 + 7 + 3 = −2' },

  // 累乗の係数
  { cat: 2, q: '(−3a)² × 2a', a: '18a³', hint: '(−3)² <strong>= 9</strong>（係数も2乗！）<br>9a² × 2a = 18a³' },
  { cat: 2, q: '(−2x)³ × 3x²', a: '−24x⁵', hint: '(−2)³ <strong>= −8</strong>（奇数乗→負）<br>−8x³ × 3x² = −24x⁵' },
  { cat: 2, q: '(−4b)² × b', a: '16b³', hint: '(−4)² <strong>= 16</strong>（偶数乗→正）<br>16b² × b = 16b³' },
  { cat: 2, q: '(−3x)² × (−2x)', a: '−18x³', hint: '(−3)² <strong>= 9</strong>（正）<br>9x² × (−2x) = −18x³' },
  { cat: 2, q: '(−2a)⁴ × a', a: '16a⁵', hint: '(−2)⁴ <strong>= 16</strong>（偶数乗→正！）<br>16a⁴ × a = 16a⁵' },
  { cat: 2, q: '(−3)² + (−3)³', a: '−18', hint: '(−3)² = 9、(−3)³ <strong>= −27</strong><br>9 + (−27) = −18' },

  // 方程式の符号
  { cat: 3, q: '−2x = 1 を解け', a: 'x = −1/2', hint: '両辺を<strong>−2で割る</strong><br>符号が反転！　x = 1÷(−2) = −1/2' },
  { cat: 3, q: '−3x = 12 を解け', a: 'x = −4', hint: '÷(−3)で<strong>符号反転</strong><br>x = 12÷(−3) = −4' },
  { cat: 3, q: '5 − 2x = 11 を解け', a: 'x = −3', hint: '−2x = 6 → x = 6÷(−2) <strong>= −3</strong>' },
  { cat: 3, q: '7x − 3 = −17 を解け', a: 'x = −2', hint: '7x = −14 → x = −14÷7 <strong>= −2</strong>' },
  { cat: 3, q: 'x + 3[x−2(x−1)] = 7\nを解け', a: 'x = −1/2', hint: '展開：x + 3[x−2x+2] = 7<br>x + 3[−x+2] = 7<br>x − 3x + 6 = 7<br>−2x = 1 → x = <strong>−1/2</strong>' },

  // 文字式の表し方
  { cat: 4, q: 'a × b × a × (−0.1)\nを文字式で表せ', a: '−0.1a²b', hint: '係数−0.1を前に、文字はアルファベット順<br>a×a = a²　なので <strong>−0.1a²b</strong>' },
  { cat: 4, q: 'x × (−4) × y × x\nを文字式で表せ', a: '−4x²y', hint: '係数−4を前に、x×x=x²<br>アルファベット順に：<strong>−4x²y</strong>' },
  { cat: 4, q: 'a × (−1) × b × a\nを文字式で表せ', a: '−a²b', hint: '係数−1は省略、a×a=a²<br>→ <strong>−a²b</strong>' },
  { cat: 4, q: 'x ÷ 3 × y ÷ (−2)\nを文字式で表せ', a: '−xy/6', hint: '÷3×÷(−2) = ÷(−6)<br>→ <strong>−xy/6</strong>' },
  { cat: 4, q: '(−2a) × (−2a) × b × 3\nを文字式で表せ', a: '12a²b', hint: '(−2)×(−2) = 4（負×負=正）<br>4×3=12、a×a=a²<br>→ <strong>12a²b</strong>' },
  { cat: 4, q: '(x+y) ÷ 4\nを文字式で表せ', a: '(x+y)/4', hint: '÷4 は分母に4<br>→ <strong>(x+y)/4</strong>　※x/4+y/4 も正解' },

  // 一次式の計算
  { cat: 5, q: '(5a−3) − (2a+1)', a: '3a−4', hint: '括弧の前の−を分配：<br>5a−3 <strong>−2a−1</strong><br>= 3a−4' },
  { cat: 5, q: '3(2x−1)', a: '6x−3', hint: '3を分配：3×2x=6x、3×(−1)=−3<br>→ <strong>6x−3</strong>' },
  { cat: 5, q: '−2(3a+5)', a: '−6a−10', hint: '−2を分配：−2×3a=−6a、−2×5=<strong>−10</strong><br>→ −6a−10' },
  { cat: 5, q: '2(x+3) + 3(x−1)', a: '5x+3', hint: '2x+6+3x−3<br>= <strong>5x+3</strong>' },
  { cat: 5, q: '4(2a−1) − 3(a+2)', a: '5a−10', hint: '8a−4−3a−6<br>= <strong>5a−10</strong>' },
  { cat: 5, q: '(6a+9) ÷ (−3)', a: '−2a−3', hint: '÷(−3)は各項に：<br>6a÷(−3) = <strong>−2a</strong>、9÷(−3) = <strong>−3</strong>' },
  { cat: 5, q: '−(x−5) + 2(x+3)', a: 'x+11', hint: '−x+5+2x+6<br>= <strong>x+11</strong>' },
  { cat: 5, q: '5(x−2) − 2(2x−3)', a: 'x−4', hint: '5x−10−4x+6<br>= <strong>x−4</strong>' },

  // 式の展開・整理
  { cat: 6, q: '(5a−2)/3 + (a+4)/6', a: '11a/6', hint: '通分（分母6）：(10a−4)/6 + (a+4)/6<br>= (11a)/6　※定数消える！' },
  { cat: 6, q: '(2x−1)/4 − (3x+2)/6', a: '−n/12 − 7/6\n正解：(−n−14)/12', hint: '通分（分母12）：3(2x−1)/12 − 2(3x+2)/12<br>= (6x−3−6x−4)/12 = <strong>−7/12</strong>' },
  { cat: 6, q: '3(a+b) − 2(a−b)', a: 'a+5b', hint: '3a+3b−2a+2b<br>注意：−2×(−b) = <strong>+2b</strong><br>= a+5b' },
  { cat: 6, q: '2a − 3[a−2(a−1)]', a: '5a−6', hint: '内側から：2(a−1) = 2a−2<br>a−(2a−2) = −a+2<br>2a−3(−a+2) = 2a+3a−6 = <strong>5a−6</strong>' },
  { cat: 6, q: '4a − [3a − {2a−(a−1)}]', a: '3a−1', hint: '最内側から展開：<br>2a−a+1 = a+1<br>3a−(a+1) = 2a−1<br>4a−(2a−1) = <strong>2a+1</strong>' },
  { cat: 6, q: '1/2(4x−6) − 1/3(3x−9)', a: 'x', hint: '= 2x−3 − x+3<br>= <strong>x</strong>（定数が消える！）' },
];

let questions = [];
let current = 0;
let shown = false;
let correct = 0;
let wrong = 0;
let streak = 0;
let missed = [];

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

function init() {
  questions = shuffle(PROBLEMS);
  current = 0;
  shown = false;
  correct = 0;
  wrong = 0;
  streak = 0;
  missed = [];
  updateStreak();
  render();
}

function updateStreak() {
  document.getElementById('streak-num').textContent = streak;
}

function render() {
  const app = document.getElementById('app');
  if (current >= questions.length) {
    renderResult(app);
    return;
  }
  const q = questions[current];
  const cat = CATEGORIES[q.cat];
  const pct = (current / questions.length * 100).toFixed(0);

  app.innerHTML = `
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" style="width:${pct}%"></div>
    </div>
    <div class="progress-text">${current + 1} / ${questions.length}</div>

    <div class="dots">
      ${questions.map((_, i) => {
        const cls = i < current ? 'done' : i === current ? 'current' : '';
        return `<div class="dot ${cls}"></div>`;
      }).join('')}
    </div>

    <div class="cat-pill ${cat.cls}">${cat.icon} ${cat.name}</div>

    <div class="card" id="main-card" onclick="showAnswer()">
      <div class="card-hint">次の計算をしましょう</div>
      <div class="problem-text">${q.q.replace(/\n/g, '<br>')}</div>
      <div class="tap-prompt">タップして答えを確認 →</div>
    </div>
    <div id="answer-area"></div>
  `;
}

function showAnswer() {
  if (shown) return;
  shown = true;
  const q = questions[current];
  const card = document.getElementById('main-card');
  card.style.cursor = 'default';
  card.onclick = null;

  document.getElementById('answer-area').innerHTML = `
    <div class="answer-reveal">
      <div class="answer-box">
        <div class="answer-label">✓ 正解</div>
        <div class="answer-value">${q.a}</div>
      </div>
      <div class="hint-box">💡 ${q.hint}</div>
      <div class="btn-row">
        <button class="btn btn-ok" onclick="next(true)">✓ できた</button>
        <button class="btn btn-ng" onclick="next(false)">✗ ミスした</button>
      </div>
    </div>
  `;
}

function next(ok) {
  if (ok) {
    correct++;
    streak++;
  } else {
    wrong++;
    streak = 0;
    missed.push(questions[current]);
  }
  updateStreak();
  current++;
  shown = false;
  render();
}

function renderResult(app) {
  const total = correct + wrong;
  const pct = Math.round(correct / total * 100);
  let emoji, title, scoreClass;
  if (pct >= 90) { emoji = '🏆'; title = '完璧！符号マスター'; scoreClass = 'score-good'; }
  else if (pct >= 70) { emoji = '💪'; title = 'いい調子！もう少し'; scoreClass = 'score-ok'; }
  else { emoji = '🔥'; title = '要復習！繰り返そう'; scoreClass = 'score-bad'; }

  app.innerHTML = `
    <div class="result-screen">
      <span class="result-emoji">${emoji}</span>
      <div class="result-title">${title}</div>
      <div class="result-score ${scoreClass}">${pct}%</div>
      <div class="result-detail">
        正解 ${correct} 問 / 全 ${total} 問<br>
        ミス ${wrong} 問
      </div>
      ${missed.length > 0 ? `
        <div class="missed-list">
          <h3>MISSED PROBLEMS</h3>
          ${missed.map(q => `
            <div class="missed-item">
              <span>${q.q.replace(/\n.*/,'')}</span>
              <span class="missed-ans">${q.a}</span>
            </div>
          `).join('')}
        </div>
      ` : ''}
      <button class="btn-retry" onclick="init()">もう一度チャレンジ →</button>
    </div>
  `;
}

init();
</script>
</body>
</html>
